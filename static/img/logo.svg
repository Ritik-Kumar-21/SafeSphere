<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <!-- Sphere Radial Glow Gradient -->
    <radialGradient id="sphereGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="25%" stop-color="#f59e0b"/>
      <stop offset="55%" stop-color="#e11d48"/>
      <stop offset="90%" stop-color="#881337"/>
      <stop offset="100%" stop-color="#18090b"/>
    </radialGradient>

    <!-- Outer Orbital Ring Gradient -->
    <linearGradient id="orbitGrad" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="sphereGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Protective Shield Hex -->
  <polygon points="24,3 43,13.5 43,34.5 24,45 5,34.5 5,13.5" stroke="url(#orbitGrad)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="#06090e" fill-opacity="0.85"/>
  <polygon points="24,6.5 39.5,15.2 39.5,32.8 24,41.5 8.5,32.8 8.5,15.2" stroke="#38bdf8" stroke-width="0.8" stroke-dasharray="3 2" fill="none" opacity="0.45"/>

  <!-- Orbital Ring 1 (Inclined Orbit) -->
  <ellipse cx="24" cy="24" rx="19" ry="7.5" transform="rotate(-30 24 24)" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="6 3" fill="none" opacity="0.75"/>

  <!-- Central Safe Sphere Core -->
  <circle cx="24" cy="24" r="11" fill="url(#sphereGrad)" filter="url(#sphereGlow)"/>

  <!-- Sphere Latitude & Longitude Curvature -->
  <ellipse cx="24" cy="24" rx="11" ry="4.5" stroke="#ffffff" stroke-width="0.8" fill="none" opacity="0.4"/>
  <ellipse cx="24" cy="24" rx="4.5" ry="11" stroke="#ffffff" stroke-width="0.8" fill="none" opacity="0.4"/>

  <!-- Specular High-Light Reflection -->
  <ellipse cx="20.5" cy="19.5" rx="3.5" ry="2" fill="#ffffff" opacity="0.7" transform="rotate(-25 20.5 19.5)"/>
</svg>
